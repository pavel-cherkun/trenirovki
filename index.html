<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121311">
<meta name="robots" content="noindex">
<title>Зал · программа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121311; --bg2:#1a1b18; --bg3:#23241f; --line:#30312b;
  --ink:#eeede6; --mute:#a3a298; --dim:#77766d;
  --tape:#f4c20d; --tape-ink:#141410; --stop:#ff6a4d;
  --fg:#d9d8d0; --fg-far:#8a897f; --fg-ghost:#5a5a52; --tape-far:#a3820f; --eq:#74736a;
  --r:14px; --gut:16px;
  --display:"Unbounded",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);min-height:100dvh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
::selection{background:var(--tape);color:var(--tape-ink)}
:focus-visible{outline:2px solid var(--tape);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--gut)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(18,19,17,.94);backdrop-filter:saturate(1.2) blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.logo{font:700 15px/1 var(--display);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:12px;background:repeating-linear-gradient(-45deg,var(--tape) 0 4px,var(--tape-ink) 4px 8px);border-radius:2px}
.tabs{margin-left:auto;display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{padding:8px 11px;border-radius:999px;font-size:14px;font-weight:500;color:var(--mute);min-height:38px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}

/* week strip */
.strip{border-bottom:1px solid var(--line);background:var(--bg)}
.strip .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.strip .wrap::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:64px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);text-align:left;background:var(--bg2)}
.day b{display:block;font:500 12px/1.2 var(--body);color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.day span{font:700 15px/1.3 var(--display)}
.day.legs b{color:var(--tape)}
.day[aria-current=true]{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.day[aria-current=true] b{color:var(--tape-ink)}
.day.past:not([aria-current=true]){opacity:.55}
.day.today:not([aria-current=true]){border-color:var(--tape)}

/* session head */
.head{padding:22px 0 8px}
.when{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.badge{font:600 12px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;padding:6px 8px;border-radius:6px;background:var(--bg3);color:var(--ink)}
.badge.on{background:var(--tape);color:var(--tape-ink)}
h1{font:700 clamp(30px,9vw,44px)/1.05 var(--display);letter-spacing:-.02em;margin:12px 0 10px;text-wrap:balance}
.lead{color:var(--mute);max-width:60ch}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.meta span{font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink)}

/* blocks */
.block{margin-top:30px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
h2{font:700 18px/1.2 var(--display);letter-spacing:.01em}
.bh small{color:var(--dim);font-size:13px}
.list{border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);overflow:hidden}
.li{padding:13px 16px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:space-between}
.li:first-child{border-top:0}
.li em{font-style:normal;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}

/* exercise */
.tl{list-style:none;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);overflow:hidden}
.tl li{display:grid;grid-template-columns:54px 1fr;column-gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.tl li>.car{grid-column:1/-1;margin:12px -16px 0;padding:0 16px}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
.car::-webkit-scrollbar{display:none}
.mv{flex:0 0 min(82%,300px);scroll-snap-align:start;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px}
.tl .mv{background:var(--bg)}
.mv:only-child{flex-basis:100%}
.mv .dg text{font-size:19px}
.mv .dg text.ph{font-size:16px}
.mv .dg{margin:0;border:0;padding:4px 2px 0;background:transparent}
.mv-t{display:flex;align-items:baseline;gap:4px;padding:6px 6px 4px;font-size:15px}
.mv-t span{color:var(--tape);font-weight:600}
.mv-t em{margin-left:auto;font-style:normal;color:var(--mute);white-space:nowrap;padding-left:8px}
.tl li:first-child{border-top:0}
.tm{font:700 15px/1.2 var(--display);color:var(--tape);min-width:54px;white-space:nowrap}
.tm small{display:block;font:500 11px var(--body);color:var(--mute)}
.tl b{font-weight:600}
.tl p{color:var(--mute);font-size:15px;margin-top:2px}
.ex{border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);margin-bottom:10px;overflow:hidden}
.ex.main{border-color:#4a4732}
.ex-top{padding:16px 16px 12px}
.ex-name{display:flex;gap:10px;align-items:flex-start}
.ex-name .n{font:700 13px/1.9 var(--display);color:var(--dim);min-width:22px}
.ex.main .n{color:var(--tape)}
.ex-name h3{font:600 19px/1.3 var(--body)}
.ex-name h3 small{display:block;font-size:13px;font-weight:500;color:var(--tape);margin-top:2px;letter-spacing:.02em}
.ex.acc .ex-name h3 small{color:var(--mute)}
.dose{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.dose div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dose b{display:block;font:700 20px/1.2 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.dose span{font-size:12px;color:var(--mute)}
.dg{margin:14px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 8px 10px}
.dg svg{display:block;width:100%;height:auto;max-height:250px;overflow:hidden}
.dg text{font:600 15px var(--body);fill:var(--ink)}
.dg text.ph{fill:var(--mute);font-size:13px;font-weight:500}
.dg figcaption{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;padding:0 4px;font-size:13px;color:var(--mute)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:3px;flex:none}
.lg-m{background:var(--tape)}.lg-g{background:var(--fg-ghost)}.lg-e{background:var(--stop);border-radius:50%!important;width:9px!important;height:9px!important}
.load{margin-top:10px;font-size:15px;color:var(--ink)}
.load::before{content:"Вес: ";color:var(--mute)}
.ex-act{display:flex;border-top:1px solid var(--line)}
.ex-act>*{flex:1}
.rest-btn{min-height:54px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--tape)}
.rest-btn svg{width:20px;height:20px}
.rest-btn:active{background:var(--bg3)}
details{border-left:1px solid var(--line)}
summary{min-height:54px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;color:var(--ink);list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary svg{width:16px;height:16px;transition:transform .2s}
details[open] summary svg{transform:rotate(180deg)}
.ex-more{display:none;padding:4px 16px 16px;border-top:1px solid var(--line);font-size:15px}
.ex.open .ex-more{display:block}
.ex-more h4{font:600 13px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 8px}
.ex-more ul{padding-left:18px}
.ex-more li{margin:4px 0}
.ex-more li::marker{color:var(--tape)}

.note{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--bg2);font-size:15px;color:var(--ink)}
.note b{color:var(--tape)}
.note.warn{border-color:#5a3a30}
.note.warn b{color:var(--stop)}
.note+.note{margin-top:10px}

.cardio{display:grid;gap:8px}
.cm{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg2)}
.cm b{font-weight:600}
.cm p{color:var(--mute);font-size:14px;margin-top:2px}

.nav2{display:flex;gap:8px;margin-top:30px}
.nav2 button{flex:1;min-height:54px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);font-weight:500}
.nav2 button:disabled{opacity:.35}

/* week view */
.wk{margin-top:22px}
.wk h2{margin-bottom:4px}
.wk p{color:var(--mute);font-size:14px;margin-bottom:10px}
.wk-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line);min-height:62px}
.wk-row:first-child{border-top:0}
.wk-row .d{font:700 14px/1.2 var(--display);min-width:68px}
.wk-row .d small{display:block;font:500 12px var(--body);color:var(--mute)}
.wk-row .t{flex:1;font-weight:500}
.wk-row .t small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.wk-row.legs .d small{color:var(--tape)}
.wk-row.cur{background:var(--bg3)}
.wk-row svg{width:18px;height:18px;color:var(--dim)}

/* guide */
.prose p,.prose li{max-width:65ch}
.prose ul{padding-left:18px}
.prose li{margin:6px 0}
.prose li::marker{color:var(--tape)}
.rpe{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.rpe div{padding:11px 14px;border-top:1px solid var(--line)}
.rpe div:nth-child(-n+2){border-top:0}
.rpe .k{font:700 16px/1.3 var(--display);color:var(--tape);font-variant-numeric:tabular-nums}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);
  padding:0 0 env(safe-area-inset-bottom);transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.timer.on{transform:none}
.tape{height:10px;background:var(--bg3);position:relative;overflow:hidden}
.tape i{position:absolute;inset:0;transform-origin:left;background:repeating-linear-gradient(-45deg,var(--tape) 0 10px,var(--tape-ink) 10px 20px);background-size:28.28px 28.28px}
.timer .wrap{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"lbl lbl" "time ctl";align-items:center;column-gap:12px;row-gap:6px;padding-top:10px;padding-bottom:12px}
.t-ctl{grid-area:ctl;display:flex;gap:8px;justify-content:flex-end}
.t-btn svg{width:20px;height:20px;display:block;margin:auto}
.t-time{grid-area:time;font:700 40px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.t-lbl{grid-area:lbl;font-size:13px;color:var(--mute);line-height:1.3;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-lbl b{color:var(--ink);font-weight:600;font-size:14px;margin-right:8px}
.t-btn{min-width:52px;min-height:52px;border-radius:12px;background:var(--bg3);font-weight:600;font-size:15px}
.t-btn.x{background:var(--ink);color:var(--bg)}
.timer.done{background:var(--tape);color:var(--tape-ink)}
.timer.done .t-lbl,.timer.done .t-lbl b{color:var(--tape-ink)}
.timer.done .t-btn{background:rgba(0,0,0,.12)}
.timer.done .t-btn.x{background:var(--tape-ink);color:var(--tape)}

.fab{position:fixed;right:var(--gut);bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;min-height:56px;padding:0 18px;border-radius:999px;
  background:var(--ink);color:var(--bg);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.fab svg{width:20px;height:20px}
.timer.on~.fab{display:none}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:var(--bg2);width:100%;border-radius:18px 18px 0 0;padding:18px var(--gut) calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h2{margin-bottom:12px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.presets button{min-height:60px;border-radius:12px;background:var(--bg3);font:700 18px var(--display);font-variant-numeric:tabular-nums}
.foot{color:var(--dim);font-size:13px;margin-top:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo"><i></i>ЗАЛ</div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="day" aria-selected="true">Тренировка</button>
      <button role="tab" data-view="plan">План</button>
      <button role="tab" data-view="guide">Правила</button>
    </nav>
  </div>
</header>
<div class="strip" id="strip"><div class="wrap" id="stripIn"></div></div>
<main class="wrap" id="app"></main>

<div class="timer" id="timer" aria-live="polite">
  <div class="tape"><i id="tapeFill"></i></div>
  <div class="wrap">
    <div class="t-time" id="tTime">1:30</div>
    <div class="t-lbl"><b id="tWhat">Отдых</b><span id="tHint">потом следующий подход</span></div>
    <div class="t-ctl">
    <button class="t-btn" id="tMinus" aria-label="Минус 15 секунд">−15</button>
    <button class="t-btn" id="tPlus" aria-label="Плюс 15 секунд">+15</button>
    <button class="t-btn x" id="tStop" aria-label="Закрыть таймер"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  </div>
</div>
<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>Таймер</button>
<div class="sheet" id="sheet"><div class="in">
  <h2>Отдых</h2>
  <div class="presets" id="presets"></div>
</div></div>

<script>
/* ---------- упражнения ---------- */
const EX={
 legpress:{n:"Жим ногами",load:"старт 60–80 кг на платформе",tip:["Поясница и таз прижаты к спинке всё время","Стопы на ширине плеч, колени смотрят туда же, куда носки","Опускай, пока таз не начал отрываться; внизу не расслабляйся","Наверху не выпрямляй колени до замка"],swap:"Гоблет-присед или присед к скамье"},
 chestpress:{n:"Жим от груди в тренажёре",load:"лёгкий, чтобы 12 раз шли свободно",tip:["Ручки на уровне середины груди","Лопатки прижаты к спинке","Выдох на жиме, вдох на возврате"],swap:"Отжимания от скамьи"},
 latpd:{n:"Тяга верхнего блока",load:"старт 35–45 кг",tip:["Хват чуть шире плеч, грудь вперёд","Тяни к верху груди, думай «локти в карманы»","Без раскачки корпусом, вверх отпускай медленно"],swap:"Подтягивания в гравитроне"},
 cablerow:{n:"Тяга горизонтального блока",load:"старт 35–45 кг",tip:["Спина ровная, корпус почти неподвижен","Тяни к животу, в конце сведи лопатки","Вперёд отпускай медленно, плечи не тянутся к ушам"],swap:"Тяга в тренажёре с упором грудью"},
 plank:{n:"Планка",load:"вес тела",tip:["Локти под плечами, тело — одна линия","Напряги ягодицы и живот, таз не проваливается","Дыши ровно, не задерживай дыхание"],swap:"Планка с колен или dead bug лёжа"},
 bench:{n:"Жим штанги лёжа",load:"разминка — пустой гриф 20 кг; рабочий старт 30–40 кг",tip:["Глаза под грифом, лопатки сведены и опущены, стопы в пол","Гриф опускай к низу груди, локти примерно 45° от корпуса","Выдох на подъёме; больше 2–3 секунд дыхание не держи","Тяжёлые подходы — со страховкой или в Смите"],swap:"Жим гантелей лёжа или жим в тренажёре"},
 ohp:{n:"Жим гантелей сидя",load:"старт 10–14 кг каждая",tip:["Спинка вертикально, поясница прижата","Гантели от уровня ушей вверх, по слегка сходящейся траектории","Не прогибайся в пояснице, живот напряжён"],swap:"Жим в тренажёре на плечи"},
 chestrow:{n:"Тяга в тренажёре с упором грудью",load:"старт 30–40 кг",tip:["Грудь прижата к подушке — спина отдыхает","Тяни локтями назад, в конце сведи лопатки","Медленно отпускай вперёд"],swap:"Тяга гантели одной рукой с упором в скамью"},
 latraise:{n:"Махи гантелями в стороны",load:"5–8 кг",tip:["Руки чуть согнуты, поднимай до уровня плеч","Веди локтями, а не кистями","Без рывков, вес лёгкий"],swap:"Махи в кроссовере"},
 pushdown:{n:"Разгибания на блоке (трицепс)",load:"по ощущениям",tip:["Локти прижаты к корпусу и не двигаются","Внизу полностью разогни руки","Вверх — медленно"],swap:"Отжимания на брусьях в гравитроне"},
 facepull:{n:"Тяга каната к лицу",load:"лёгкий",tip:["Блок на уровне лица или чуть выше","Тяни канат к глазам, разводя руки в стороны","Полезно для плеч и осанки — не гонись за весом"],swap:"Разведения в тренажёре «бабочка» назад"},
 rdldb:{n:"Румынская тяга с гантелями",load:"2 × 12–16 кг",tip:["Колени чуть согнуты и не меняют угол","Таз уводи назад, будто закрываешь дверь попой","Гантели скользят по бёдрам, спина ровная","Опускай до растяжения задней поверхности бедра — обычно до середины голени"],swap:"Гиперэкстензия"},
 rdl:{n:"Румынская тяга со штангой",load:"старт 30–40 кг",tip:["Колени чуть согнуты, таз уходит назад","Гриф скользит по бёдрам, спина ровная","Опускай до растяжения бицепса бедра, не ниже середины голени","Вверх — толкай таз вперёд, не прогибайся"],swap:"Румынская тяга с гантелями или гиперэкстензия"},
 deadlift:{n:"Становая тяга",load:"старт 40–50 кг; пока техника не стабильна — не прибавляй",tip:["Гриф над серединой стопы, голени почти касаются","Хват чуть шире ног, «сломай гриф» — напряги широчайшие","Спина ровная, толкай пол ногами, гриф ведёшь по ногам","Опускай так же, по ногам, не бросай","Выдох наверху или по ходу подъёма — не держи дыхание весь подход"],swap:"Тяга с трэп-грифа (шестигранного) — проще для спины"},

const START=new Date(2026,10,10);
const DOW={tue:0,thu:2,sat:4};
function mk(ex,s,r,rpe,rest,role,extra){return Object.assign({ex,s,r,rpe,rest,role},extra||{})}
function sessions(){
  const out=[];
  for(let w=1;w<=6;w++){
    for(const k of ["tue","thu","sat"]){
      const d=new Date(START);d.setDate(d.getDate()+(w-1)*7+DOW[k]);
      let s;
      if(w===1) s=week1(k);
      else{
        const sc=W[w],T=DAY_TMPL[k];
        const main=T.main.map((id,i)=>{
          let ex=id;
          if(w===2&&id==="squat") ex="goblet";
          if(w===2&&id==="deadlift") ex="kbdl";
          if(w===2&&id==="rdl") ex="rdldb";
          let [sets,reps,rpe,rest]=sc.main;
          if(i===1){sets=Math.min(sets,3);reps=w===5?"8":reps;rpe=w===5?"7–8":rpe;rest=Math.min(rest,150)}
          if(ex==="deadlift"){sets=Math.min(sets,3);if(w===5)reps="5"}
          return mk(ex,sets,reps,rpe,rest,"main");
        });
        const acc=T.acc.map(id=>{
          let [sets,reps,rpe,rest]=sc.acc;
          if(id==="farmer") reps="30–40 м";
          if(id==="calves") reps="15";
          if(id==="lunge") reps=(w>=5?"8":"10")+" на ногу";
          if(id==="pallof") reps="10 на сторону";
          return mk(id,sets,reps,rpe,rest,"acc");
        });
        const r=w===6?"6":"7";
        const extra=k==="sat"?[mk("farmer",2,"30–40 м",r,90,"opt"),mk("bridge",2,"12",r,60,"opt")]
                   :k==="tue"?[mk("facepull",2,"15","6",60,"opt"),mk("plank",2,"30–45 с",r,60,"opt")]
                   :[mk("pushdown",2,"12",r,60,"opt"),mk("plank",2,"30–45 с",r,60,"opt")];
        s={title:T.t,lead:sc.lead,phase:sc.name,items:[...main,...acc],extra,cardio:k==="sat"?Math.min(15,sc.cardio-10):sc.cardio,cardioHint:T.cardioHint};
      }
      s.key=k;s.week=w;s.date=d;s.idx=out.length+1;
      out.push(s);
    }
  }
  return out;
}

    extra:[mk("bridge",2,"12","6",60,"opt"),mk("farmer",2,"30 м","6",90,"opt")],cardio:10,cardioHint:"велотренажёр, совсем спокойно"};

function fitDiagrams(root){

    kids.forEach(n=>{try{const r=n.getBBox();const t=n.transform&&n.transform.baseVal.length?n.transform.baseVal[0].matrix.e:0;
      if(!r.width&&!r.height)return;x0=Math.min(x0,r.x+t);y0=Math.min(y0,r.y);x1=Math.max(x1,r.x+r.width+t);y1=Math.max(y1,r.y+r.height)}catch(_){}});
    if(x0>x1) return;
    const pad=10;x0-=pad;x1+=pad;y0=Math.min(0,y0-pad);y1=Math.max(214,y1+pad);
    let w=x1-x0,h=y1-y0;if(w<360){x0-=(360-w)/2;w=360}

 right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
};

let cur=(()=>{const m=location.hash.match(/^#t(\d+)$/);const i=m?+m[1]:0;return S[i-1]||todayS||nextS})();
let view="day";

/* ---------- рендер ---------- */
function strip(){
  $("#stripIn").innerHTML=S.filter(s=>s.week===cur.week).map(s=>
   `<button class="day ${s.key==="sat"?"legs":""} ${s.date<today?"past":""} ${todayS===s?"today":""}" data-i="${s.idx}" aria-current="${s===cur}">
     <b>${DN[s.key]}${s.key==="sat"?" · ноги":""}</b><span class="num">${fd(s.date)}</span></button>`).join("")+
   `<button class="day" data-week="${cur.week<6?cur.week+1:1}"><b>неделя</b><span>${cur.week<6?cur.week+1+" →":"1 ↺"}</span></button>`;
}
function exCard(it,n){
  const e=EX[it.ex];
  const cls=it.role==="main"?"main":"acc";
  const lbl=it.role==="main"?"база":it.role==="opt"?"доп, если есть силы":"вспомогательное";
  return `<article class="ex ${cls}">
   <div class="ex-top">
    <div class="ex-name"><span class="n num">${n}</span><h3>${esc(e.n)}<small>${lbl}</small></h3></div>
    ${diagram(it.ex)}
    <div class="dose">
     <div><b>${it.s} × ${esc(it.r)}</b><span>подх. × раз</span></div>
     <div><b>${restTxt(it.rest)}</b><span>отдых</span></div>
     <div><b>${esc(it.rpe)}</b><span>RPE</span></div>
    </div>
    <p class="load">${esc(e.load)}</p>
   </div>
   <div class="ex-act">
    <button class="rest-btn" data-rest="${it.rest}" data-name="${esc(e.n)}">${ICON.clock}Отдых ${restTxt(it.rest)}</button>
    <details><summary>Техника ${ICON.down}</summary></details>
   </div>
   <div class="ex-more">
    <h4>Как делать</h4><ul>${e.tip.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <h4>Если занято или неудобно</h4><p>${esc(e.swap)}</p>
   </div>
  </article>`;
}
function car(items){return `<div class="car">${items.map(([id,n,dose],i)=>`<div class="mv">${diagram(id,true)}<div class="mv-t"><span class="num">${items.length>1?i+1+". ":""}</span><b>${esc(n)}</b><em class="num">${esc(dose)}</em></div></div>`).join("")}</div>`}
function warm(rows){return `<ol class="tl">${rows.map(([t,h,p,mv])=>`<li><span class="tm num">${t}<small>мин</small></span><div><b>${esc(h)}</b><p>${esc(p)}</p></div>${mv?car(mv):""}</li>`).join("")}</ol>`}
function list(rows){return `<div class="list">${rows.map(([a,b])=>`<div class="li"><span>${esc(a)}</span><em>${esc(b)}</em></div>`).join("")}</div>`}
function cardioBlock(min,hint,title){
  return `<section class="block"><div class="bh"><h2>${title||"Кардио"}</h2><small class="num">${min} мин · зона 2</small></div>
   <div class="note"><b>Пульс 120–140</b> и можешь говорить фразами. Выбирай, что свободно и по настроению; сегодня лучше: ${esc(hint)}.</div>
   <div class="cardio" style="margin-top:8px">${CARDIO.map(([a,b])=>`<div class="cm"><b>${a}</b><p>${b}</p></div>`).join("")}</div></section>`;
}
function dayView(){
  const s=cur;
  const isToday=todayS===s;
  const total=s.special?"≈ 60 мин":"база ≈ 60 мин · с допами до 80";
  let n=0;
  const main=s.items.map(it=>exCard(it,String(++n).padStart(2,"0"))).join("");
  const extra=s.extra.map(it=>exCard(it,String(++n).padStart(2,"0"))).join("");
  const prev=S[s.idx-2],next=S[s.idx];
  return `
  <section class="head">
   <div class="when">${isToday?'<span class="badge on">сегодня</span>':s.date<today?'<span class="badge">прошла</span>':''}
    <span class="badge">Неделя ${s.week}/6</span><span>${DNF[s.key]}, ${fd(s.date)} · №${s.idx}</span></div>
   <h1>${esc(s.title)}</h1>
   <p class="lead">${esc(s.lead)}</p>
   <div class="meta"><span>${total}</span>${s.key==="sat"?"<span>завтра — отдых</span>":""}<span>${esc(s.phase)}</span></div>
  </section>
  <section class="block"><div class="bh"><h2>Разминка</h2><small>10 мин, подряд</small></div>${warm(s.special?WARM1:WARM)}</section>
  ${s.special?cardioBlock(s.cardioFirst,s.cardioHint,"Кардио"):""}
  <section class="block"><div class="bh"><h2>${s.special?"Лёгкая силовая":"Основная часть"}</h2><small>${s.special?"круг по тренажёрам":"по порядку"}</small></div>${main}</section>
  ${extra?`<section class="block"><div class="bh"><h2>Допы</h2><small>если есть силы и время</small></div>${extra}</section>`:""}
  ${s.cardio?cardioBlock(s.cardio,s.cardioHint):""}
  <section class="block" style="margin-right:calc(-1*var(--gut))"><div class="bh" style="margin-right:var(--gut)"><h2>Заминка и растяжка</h2><small>${s.special?"10 мин":"5–8 мин"}</small></div><p class="lead" style="margin-bottom:10px">Держи каждую позу спокойно, без рывков и боли. Листай вбок →</p>${car(COOL[s.key])}</section>
  <section class="block"><div class="note"><b>Стоп-сигналы:</b> боль или давление в груди, головокружение, пульс выше 160, который не падает за пару минут отдыха — заканчивай тренировку.</div></section>
  <div class="nav2">
   <button data-i="${prev?prev.idx:""}" ${prev?"":"disabled"}>← ${prev?DN[prev.key]+" "+fd(prev.date):""}</button>
   <button data-i="${next?next.idx:""}" ${next?"":"disabled"}>${next?DN[next.key]+" "+fd(next.date):""} →</button>
  </div>`;
}
function planView(){
  let h=`<section class="head"><h1>План на 6 недель</h1><p class="lead">Вторник и четверг — верх и тяги, суббота — всегда ноги, воскресенье отдыхаешь. Через 6 недель повторяем недели 3–6 с весами на 5–10% больше.</p></section>`;
  for(let w=1;w<=6;w++){
    const ss=S.filter(s=>s.week===w);
    const name=w===1?"Вход":W[w].name;
    const p=w===1?"Лёгкие веса, учим технику, RPE 5–6.":`База ${W[w].main[0]} × ${W[w].main[1]}, RPE ${W[w].main[2]} · кардио ${W[w].cardio} мин.`;
    h+=`<section class="wk"><h2>Неделя ${w} · ${name}</h2><p>${p}</p><div class="list">${ss.map(s=>`
     <button class="wk-row ${s.key==="sat"?"legs":""} ${s===todayS||(!todayS&&s===nextS)?"cur":""}" data-i="${s.idx}">
      <span class="d num">${fd(s.date)}<small>${DNF[s.key]}</small></span>
      <span class="t">${esc(s.title)}<small>${s.items.filter(i=>i.role==="main").map(i=>EX[i.ex].n).join(", ")}</small></span>${ICON.right}</button>`).join("")}</div></section>`;
  }
  return h;
}
function guideView(){
  return `<section class="head"><h1>Правила</h1><p class="lead">Коротко о том, как читать программу и не перегнуть.</p></section>
  <section class="block"><div class="bh"><h2>RPE — насколько тяжело</h2></div>
   <div class="rpe"><div class="k">5</div><div>Разминка. Можно ещё 5+ повторов</div><div class="k">6</div><div>Легко. В запасе 4 повтора</div><div class="k">7</div><div>Рабочее. В запасе 3 повтора</div><div class="k">8</div><div>Тяжело. В запасе 2 повтора, техника не ломается</div><div class="k">9–10</div><div>Почти отказ. В этой программе не используем</div></div></section>
  <section class="block prose"><div class="bh"><h2>Как прибавлять вес</h2></div><ul>
   <li>Сделал все подходы и повторы, а RPE ниже плана — в следующий раз +2,5 кг на жимах, +5 кг на приседе и тягах.</li>
   <li>Не добрал повторы — оставь вес, добери в следующий раз.</li>
   <li>Техника поплыла — сбрось 10% и сделай чисто.</li>
   <li>Не знаешь вес — начни с пустого грифа и прибавляй, пока подход не станет на нужный RPE.</li></ul></section>
  <section class="block prose"><div class="bh"><h2>Пульс</h2></div>
   <div class="note"><b>Зона 2:</b> примерно 120–140 уд/мин на часах, дышишь носом или говоришь фразами. Если часы показывают другую «зону 2» — ориентируйся на разговор.</div>
   <div class="note"><b>Между подходами</b> отдыхай, пока пульс не опустится до ~115–120 и дыхание не успокоится. Таймер — ориентир, а не приказ.</div>
   <div class="note"><b>Дыхание:</b> выдох на усилии. Не задерживай дыхание дольше 2–3 секунд — это резко поднимает давление.</div>
   <div class="note warn"><b>Если пульс в покое выше 90</b> — это выше обычного. Стоит заглянуть к терапевту: ЭКГ, давление, анализы на щитовидку и гемоглобин. Обычно это просто детренированность, и пульс падает за пару месяцев кардио, но лучше знать точно.</div></section>
  <section class="block prose"><div class="bh"><h2>Чтобы сбросить вес без диеты</h2></div><ul>
   <li>Шаги: 8–10 тысяч в день вне зала. Это самый большой вклад в дефицит.</li>
   <li>Кардио в зоне 2 после силовой — каждый раз, по плану недели.</li>
   <li>Отдых между подходами — не дольше плана: так тренировка плотнее.</li>
   <li>Сон 7+ часов — без него вес уходит хуже.</li>
   <li>По желанию, необязательно: стакан воды до тренировки и белковый продукт после.</li></ul></section>
  <section class="block prose"><div class="bh"><h2>Если что-то занято</h2></div><p>У каждого упражнения есть замена — открой «Техника». Порядок можно поменять, но базу делай первой, пока свежий.</p></section>
  <p class="foot">Программа: вт · чт · сб, 10 ноября — 19 декабря 2026.</p>`;
}
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));
  $("#strip").style.display=view==="day"?"":"none";
  if(view==="day") strip();
  $("#app").innerHTML=view==="day"?dayView():view==="plan"?planView():guideView();
  if(view==="day") fitDiagrams($("#app"));
}
function go(i){cur=S[i-1];view="day";history.replaceState(null,"","#t"+i);render();scrollTo({top:0});
  const a=document.querySelector('.day[aria-current="true"]');a&&a.scrollIntoView({inline:"center",block:"nearest"})}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,summary");if(!t)return;
  if(t.matches(".tabs button")){view=t.dataset.view;render();scrollTo({top:0});return}
  if(t.dataset.i){go(+t.dataset.i);return}
  if(t.dataset.week){const w=+t.dataset.week;go(S.find(s=>s.week===w).idx);return}
  if(t.matches("summary")){e.preventDefault();const ex=t.closest(".ex");ex.classList.toggle("open");t.parentElement.open=ex.classList.contains("open");return}
  if(t.dataset.rest){startTimer(+t.dataset.rest,t.dataset.name);return}
});

/* ---------- таймер ---------- */
let endAt=0,dur=0,tick=null,ac=null,lock=null,label="";
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  [0,.25,.5].forEach(o=>{const g=ac.createGain(),os=ac.createOscillator();os.frequency.value=880;os.connect(g);g.connect(ac.destination);
   g.gain.setValueAtTime(.0001,ac.currentTime+o);g.gain.exponentialRampToValueAtTime(.4,ac.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+o+.2);
   os.start(ac.currentTime+o);os.stop(ac.currentTime+o+.22)})}catch(_){}}
async function wake(on){try{if(on&&"wakeLock" in navigator){lock=await navigator.wakeLock.request("screen")}else if(!on&&lock){await lock.release();lock=null}}catch(_){}}
function startTimer(sec,name){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(_){}
  dur=sec;endAt=Date.now()+sec*1000;label=name||"Отдых";
  $("#tWhat").textContent=label;$("#tHint").textContent="потом следующий подход";
  $("#timer").classList.add("on");$("#timer").classList.remove("done");$("#sheet").classList.remove("on");
  wake(true);clearInterval(tick);tick=setInterval(upd,200);upd();
}
function upd(){
  const left=(endAt-Date.now())/1000;
  $("#tTime").textContent=fmt(left);
  $("#tapeFill").style.transform=`scaleX(${Math.max(0,left/dur)})`;
  if(left<=0){clearInterval(tick);tick=null;$("#timer").classList.add("done");$("#tWhat").textContent="Пора, следующий подход";$("#tHint").textContent=label;
    beep();navigator.vibrate&&navigator.vibrate([250,120,250,120,400]);wake(false)}
}
function stopTimer(){clearInterval(tick);tick=null;$("#timer").classList.remove("on","done");wake(false)}
function shift(d){if(!tick){startTimer(Math.max(15,d>0?d:15),label);return}endAt+=d*1000;dur=Math.max(dur,(endAt-Date.now())/1000);upd()}
$("#tStop").onclick=stopTimer;$("#tPlus").onclick=()=>shift(15);$("#tMinus").onclick=()=>shift(-15);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tick){upd();wake(true)}});
$("#presets").innerHTML=[45,60,90,120,150,180].map(s=>`<button data-rest="${s}" data-name="Отдых">${fmt(s)}</button>`).join("");
$("#fab").onclick=()=>$("#sheet").classList.add("on");
$("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#sheet").classList.remove("on")};

render();
</script>
</body>
</html>
